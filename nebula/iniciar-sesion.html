            <img src="./imgs/nebula-03.svg" alt="Logo Nébula Music">

        <ul>

<header class="principal">
    <img src="./imgs/cover.jpg" alt="Cover Nébula, a series of albums on outer space">
    <h1>Tu música en la nube y en tu espacio.</h1>

</header>

<main>

    <h2>Inicia Sesión</h2>

    <form action="">
        <div>
            <label for="usermail">Correo electrónico</label>
            <input type="email" name="email" id="usermail" required placeholder="correo@mail.com">
            <span>Ingresa tu correo electrónico</span>
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" required placeholder="**********">
            <span>¿No recuerdas tu contraseña?<a href="#"> Recupérala</a></span>
        </div>

        <input type="submit" value="Enviar" disabled>

    </form>

    <footer>
        <p>Copyright Nébula 2026.</p>
    </footer>

</main>



</body>
